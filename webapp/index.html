<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TEJA RACE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #D91C1C;
    --red-dark: #a10f0f;
    --red-deep: #6e0a0a;
    --white: #ffffff;
    --off: #f6f5f3;
    --ink: #17130f;
    --ink-soft: #514c46;
    --gold: #e0aa22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--off);
    font-family:'Inter', sans-serif;
    color: var(--ink);
  }
  .app{ max-width:480px; margin:0 auto; padding-bottom:70px; min-height:100vh; }

  .header{
    background: linear-gradient(155deg, var(--ink) 0%, #241d16 55%, var(--red-deep) 130%);
    padding: 20px 20px 24px;
    color: var(--white);
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:200px; height:200px;
    background: radial-gradient(circle, rgba(217,28,28,.5), transparent 70%);
  }
  .header-top{ display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2; }
  .brand{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:21px; }
  .brand span{ color:var(--red); }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background: linear-gradient(145deg,#3a332a,#171310);
    border:2px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px;
  }

  .gauge-row{ display:flex; align-items:center; gap:18px; margin-top:20px; position:relative; z-index:2; }
  .gauge-wrap{ width:112px; height:112px; position:relative; flex-shrink:0; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
  .gauge-face{
    width:100%; height:100%; border-radius:50%;
    background: conic-gradient(from 200deg, var(--red) 0deg, var(--red) calc(var(--pct,0) * 1.4deg), rgba(255,255,255,.12) calc(var(--pct,0) * 1.4deg), rgba(255,255,255,.12) 280deg, transparent 280deg);
    display:flex; align-items:center; justify-content:center; position:relative;
    transition: --pct .6s ease;
  }
  .gauge-face::before{
    content:""; position:absolute; inset:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a241d, #100d0a 70%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.6), inset 0 -2px 4px rgba(255,255,255,.05);
  }
  .gauge-center{ position:relative; z-index:3; text-align:center; color:var(--white); }
  .gauge-center b{ font-family:'Rajdhani',sans-serif; font-size:22px; display:block; line-height:1; }
  .gauge-center small{ font-size:9px; letter-spacing:.4px; color:#c9c4bc; }

  .gauge-copy .label{ font-size:12px; color:#cfc9c0; margin-bottom:4px; }
  .gauge-copy .delta{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; color:#69d98c; display:flex; align-items:center; gap:6px; }
  .gauge-copy .delta.bad{ color:#e97a6c; }
  .gauge-copy .delta small{ font-size:12px; color:#cfc9c0; font-weight:500; font-family:'Inter',sans-serif; }
  .streak{ margin-top:10px; font-size:11.5px; color:#e7c9a6; }

  .checker{
    height:6px;
    background-image: linear-gradient(45deg, var(--ink) 25%, transparent 25%, transparent 75%, var(--ink) 75%),
      linear-gradient(45deg, var(--ink) 25%, transparent 25%, transparent 75%, var(--ink) 75%);
    background-size: 12px 12px; background-position: 0 0, 6px 6px; opacity:.9;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .podium-section{ padding: 24px 20px 8px; }
  .section-title{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px;
    color: var(--ink); margin-bottom:14px; display:flex; justify-content:space-between; align-items:baseline;
  }
  .section-title .period{ font-family:'Inter',sans-serif; font-weight:500; font-size:11.5px; color:var(--ink-soft); }

  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:10px; perspective:700px; padding:10px 4px 0; }
  .p-block{ flex:1; text-align:center; }
  .p-card{ background: var(--white); border-radius:14px 14px 0 0; padding: 12px 8px 0; position:relative; }
  .p-rider{
    width:46px;height:46px;border-radius:50%; margin: -34px auto 8px; border:3px solid var(--white);
    background: linear-gradient(145deg,#3a332a,#171310);
    display:flex;align-items:center;justify-content:center; color:#fff;
    font-family:'Rajdhani',sans-serif; font-weight:700; box-shadow: 0 6px 10px rgba(0,0,0,.25);
  }
  .p-1 .p-rider{ border-color: var(--gold); width:56px;height:56px; margin-top:-40px; }
  .p-name{ font-size:12px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-score{ font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--red); font-size:14px; padding-bottom:10px; }
  .p-riser{
    background: linear-gradient(160deg, var(--red) 0%, var(--red-dark) 100%); color:#fff;
    display:flex; align-items:flex-start; justify-content:center; padding-top:8px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.25), 0 8px 0 rgba(0,0,0,.15);
    transform: rotateX(6deg); transform-origin: top;
  }
  .r1{ height:78px; background:linear-gradient(160deg,#e2c15a,var(--gold)); }
  .r2{ height:56px; }
  .r3{ height:40px; background:linear-gradient(160deg,#e7625f, var(--red-dark)); }

  .board{ padding: 18px 20px 4px; }
  .row{ display:flex; align-items:center; gap:12px; background: var(--white); border-radius:14px; padding:11px 12px; margin-bottom:9px; }
  .row.me{ background: linear-gradient(100deg, #fff 60%, #fff0ee 100%); border: 1.5px solid var(--red); }
  .rank{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color: var(--ink-soft); width:22px; text-align:center; }
  .row.me .rank{ color:var(--red); }
  .r-avatar{
    width:36px;height:36px;border-radius:10px; background: linear-gradient(145deg,#efece7,#dcd8d1);
    display:flex;align-items:center;justify-content:center; font-family:'Rajdhani',sans-serif;
    font-weight:700; font-size:13px; color:var(--ink-soft); flex-shrink:0;
  }
  .r-info{ flex:1; min-width:0; }
  .r-name{ font-size:13px; font-weight:600; }
  .r-car{ font-size:11px; color:var(--ink-soft); }
  .r-stat{ text-align:right; }
  .r-lp{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; }
  .r-tag{ font-size:9.5px; color:var(--ink-soft); }
  .r-tag.pos{ color:#2e9e52; }
  .r-tag.neg{ color:var(--red); }

  .empty{ text-align:center; padding: 30px 20px; color: var(--ink-soft); font-size:13px; }

  /* --- Kiritish (entry form) screen --- */
  .form-wrap{ padding: 24px 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #e5e1da;
    font-size:15px; font-family:'Inter',sans-serif; background:#fff;
  }
  .field input:focus{ outline:none; border-color: var(--red); }
  .submit-btn{
    width:100%; padding:14px; border:none; border-radius:14px;
    background: linear-gradient(160deg, var(--red) 0%, var(--red-dark) 100%);
    color:#fff; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px;
    letter-spacing:.3px; box-shadow: 0 8px 18px rgba(217,28,28,.35);
  }
  .submit-btn:active{ transform: translateY(1px); }
  .result-card{
    margin-top:16px; padding:14px; border-radius:14px; background:#fff;
    border: 1.5px solid #e5e1da; font-size:13px; display:none;
  }
  .result-card.show{ display:block; }
  .result-card b{ color: var(--red); font-family:'Rajdhani',sans-serif; font-size:18px; }

  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex; justify-content:space-around; background: var(--white);
    border-top: 1px solid #eae7e2; padding: 10px 6px 16px;
  }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color: var(--ink-soft); font-weight:600; background:none; border:none; }
  .tab.active{ color: var(--red); }
  .tab .dot{ width:20px; height:3px; border-radius:2px; background: transparent; }
  .tab.active .dot{ background: var(--red); }
  .tab-ic{ font-size:17px; line-height:1; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-top">
      <div class="brand">TEJA<span>RACE</span></div>
      <div class="avatar" id="avatarInitials">--</div>
    </div>
    <div class="gauge-row">
      <div class="gauge-wrap">
        <div class="gauge-face" id="gaugeFace" style="--pct:0">
          <div class="gauge-center">
            <b id="gaugeLp100">--</b>
            <small>L/100KM</small>
          </div>
        </div>
      </div>
      <div class="gauge-copy">
        <div class="label">Shu haftalik sarfingiz</div>
        <div class="delta" id="deltaLine">-- <small>ma'lumot yo'q</small></div>
        <div class="streak" id="streakLine">⛽ Hali yozuv kiritilmagan</div>
      </div>
    </div>
  </div>

  <div class="checker"></div>

  <!-- REYTING SCREEN -->
  <div class="screen active" id="screen-reyting">
    <div class="podium-section">
      <div class="section-title">Shahar reytingi <span class="period" id="periodLabel">Bu hafta</span></div>
      <div class="podium" id="podium"></div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- KIRITISH SCREEN -->
  <div class="screen" id="screen-kiritish">
    <div class="form-wrap">
      <div class="section-title">Yangi yoqilg'i yozuvi</div>
      <div class="field">
        <label>Qancha litr quydingiz?</label>
        <input type="number" id="inLiters" placeholder="masalan, 30" inputmode="decimal">
      </div>
      <div class="field">
        <label>Oxirgi quyishdan beri necha km yurdingiz?</label>
        <input type="number" id="inDistance" placeholder="masalan, 480" inputmode="decimal">
      </div>
      <div class="field">
        <label>Summasi (ixtiyoriy)</label>
        <input type="number" id="inAmount" placeholder="so'mda" inputmode="decimal">
      </div>
      <button class="submit-btn" id="submitEntry">Yozuvni saqlash</button>
      <div class="result-card" id="resultCard"></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-screen="reyting">
      <div class="tab-ic">🏁</div> Reyting
      <div class="dot"></div>
    </button>
    <button class="tab" data-screen="kiritish">
      <div class="tab-ic">⛽</div> Kiritish
      <div class="dot"></div>
    </button>
  </div>

</div>

<script>
  // ---- SOZLAMALAR: backend joylashtirilgandan keyin shu manzilni o'zgartiring ----
  const API_BASE = "http://127.0.0.1:8811"; // masalan: https://teja-race-api.onrender.com

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const tgUser = tg?.initDataUnsafe?.user;
  const userId = tgUser?.id || 999999; // brauzerda sinash uchun zaxira ID
  const userName = tgUser?.first_name || "Mehmon";

  document.getElementById("avatarInitials").textContent =
    userName.slice(0, 2).toUpperCase();

  async function registerIfNeeded() {
    try {
      await fetch(`${API_BASE}/api/user/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: userId,
          name: userName,
          city: "Buxoro",
          car_model: "Noma'lum",
          baseline_lp100: 8.0,
        }),
      });
    } catch (e) { console.error("Register xatosi:", e); }
  }

  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/api/profile/${userId}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.week_lp100 != null) {
        document.getElementById("gaugeLp100").textContent = data.week_lp100;
        const pct = Math.max(0, Math.min(100, 50 + data.week_saving_pct));
        document.getElementById("gaugeFace").style.setProperty("--pct", pct);

        const deltaEl = document.getElementById("deltaLine");
        if (data.week_saving_pct >= 0) {
          deltaEl.className = "delta";
          deltaEl.innerHTML = `▼${data.week_saving_pct}% <small>o'rtachadan tejamkor</small>`;
        } else {
          deltaEl.className = "delta bad";
          deltaEl.innerHTML = `▲${Math.abs(data.week_saving_pct)}% <small>o'rtachadan ko'p sarf</small>`;
        }
        document.getElementById("streakLine").textContent =
          `⛽ Bu hafta ${data.entries_this_week} marta yozuv kiritilgan`;
      }
    } catch (e) { console.error("Profil xatosi:", e); }
  }

  async function loadLeaderboard() {
    const podium = document.getElementById("podium");
    const board = document.getElementById("board");
    try {
      const res = await fetch(`${API_BASE}/api/leaderboard?city=Buxoro`);
      const data = await res.json();
      const list = data.leaderboard || [];

      if (list.length === 0) {
        podium.innerHTML = "";
        board.innerHTML = `<div class="empty">Hali hech kim bu hafta yozuv kiritmagan.<br>Birinchi bo'ling! ⛽</div>`;
        return;
      }

      const top3 = list.slice(0, 3);
      const rest = list.slice(3);
      const initials = n => n.slice(0,2).toUpperCase();

      const order = [top3[1], top3[0], top3[2]]; // 2-1-3 tartibida chizish uchun
      podium.innerHTML = order.map((p, idx) => {
        if (!p) return `<div class="p-block"></div>`;
        const place = p.rank;
        const riserClass = place === 1 ? "r1" : place === 2 ? "r2" : "r3";
        const cardClass = place === 1 ? "p-card p-1" : "p-card";
        return `
          <div class="p-block">
            <div class="${cardClass}">
              <div class="p-rider">${initials(p.name)}</div>
              <div class="p-name">${p.name}</div>
              <div class="p-score">${p.lp100} L</div>
            </div>
            <div class="p-riser ${riserClass}">${place}</div>
          </div>`;
      }).join("");

      board.innerHTML = rest.map(p => `
        <div class="row ${p.user_id === userId ? 'me' : ''}">
          <div class="rank">${p.rank}</div>
          <div class="r-avatar">${initials(p.name)}</div>
          <div class="r-info">
            <div class="r-name">${p.user_id === userId ? 'Siz' : p.name}</div>
            <div class="r-car">${p.car_model}</div>
          </div>
          <div class="r-stat">
            <div class="r-lp">${p.lp100} L</div>
            <div class="r-tag ${p.saving_pct >= 0 ? 'pos' : 'neg'}">${p.saving_pct >= 0 ? '▼' : '▲'}${Math.abs(p.saving_pct)}%</div>
          </div>
        </div>
      `).join("");
    } catch (e) {
      board.innerHTML = `<div class="empty">Reytingni yuklab bo'lmadi. Backend ishga tushganini tekshiring.</div>`;
      console.error("Reyting xatosi:", e);
    }
  }

  document.getElementById("submitEntry").addEventListener("click", async () => {
    const liters = parseFloat(document.getElementById("inLiters").value);
    const distance = parseFloat(document.getElementById("inDistance").value);
    const amount = parseFloat(document.getElementById("inAmount").value) || null;
    const resultCard = document.getElementById("resultCard");

    if (!liters || !distance) {
      resultCard.className = "result-card show";
      resultCard.innerHTML = "Iltimos, litr va masofani to'g'ri kiriting.";
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/fuel/entry`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, liters, distance_km: distance, amount_sum: amount }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Xatolik");

      resultCard.className = "result-card show";
      resultCard.innerHTML = `Sarfingiz: <b>${data.lp100} L/100km</b><br>Tejamkorlik: ${data.saving_pct >= 0 ? '▼' + data.saving_pct : '▲' + Math.abs(data.saving_pct)}%`;

      document.getElementById("inLiters").value = "";
      document.getElementById("inDistance").value = "";
      document.getElementById("inAmount").value = "";

      loadProfile();
      loadLeaderboard();
    } catch (e) {
      resultCard.className = "result-card show";
      resultCard.innerHTML = "Xatolik yuz berdi: " + e.message;
    }
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`screen-${tab.dataset.screen}`).classList.add("active");
    });
  });

  (async function init() {
    await registerIfNeeded();
    await loadProfile();
    await loadLeaderboard();
  })();
</script>

</body>
</html>
